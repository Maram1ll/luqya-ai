<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="fobBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="metalKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="brassKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <filter id="keyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="250" rx="16" fill="#0F172A"/>

  <!-- University Lanyard Ribbon Strap -->
  <path d="M 40 120 C 70 80 120 70 180 80 L 180 105 C 130 95 90 105 60 145 Z" fill="url(#lanyardRibbon)" stroke="#00A8B5" stroke-width="1"/>
  <text x="110" y="93" font-family="system-ui, sans-serif" font-weight="800" font-size="8" fill="#FFFFFF" letter-spacing="1">UOH CAMPUS</text>

  <!-- Solid Steel Key Ring (Center Pivot) -->
  <circle cx="195" cy="90" r="28" fill="none" stroke="url(#metalKey)" stroke-width="6" filter="url(#keyShadow)"/>
  <circle cx="195" cy="90" r="22" fill="none" stroke="#111827" stroke-width="1.5"/>

  <!-- Traditional Brass Door Key (Hanging Left-Down) -->
  <g transform="translate(195, 90) rotate(55)" filter="url(#keyShadow)">
    <!-- Key Head Bow -->
    <circle cx="0" cy="0" r="16" fill="url(#brassKey)" stroke="#78350F" stroke-width="1"/>
    <circle cx="0" cy="0" r="7" fill="#0F172A"/>
    <!-- Key Shaft -->
    <rect x="-4" y="14" width="8" height="60" fill="url(#brassKey)" stroke="#78350F" stroke-width="0.8"/>
    <!-- Key Bits / Teeth Cuts -->
    <rect x="4" y="45" width="8" height="5" fill="url(#brassKey)"/>
    <rect x="4" y="55" width="10" height="6" fill="url(#brassKey)"/>
    <rect x="4" y="67" width="7" height="7" fill="url(#brassKey)"/>
  </g>

  <!-- Silver Cylinder Security Key (Hanging Center) -->
  <g transform="translate(195, 90) rotate(15)" filter="url(#keyShadow)">
    <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#metalKey)" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
    <rect x="-3" y="14" width="6" height="65" fill="url(#metalKey)" stroke="#475569" stroke-width="0.8"/>
    <!-- Dimples -->
    <circle cx="0" cy="35" r="1.5" fill="#334155"/>
    <circle cx="0" cy="48" r="1.5" fill="#334155"/>
    <circle cx="0" cy="62" r="1.5" fill="#334155"/>
  </g>

  <!-- Smart Car Remote Key Fob (Hanging Right) -->
  <g transform="translate(250, 85)" filter="url(#keyShadow)">
    <!-- Fob Ring Connector Loop -->
    <rect x="-14" y="-8" width="12" height="16" rx="4" fill="url(#metalKey)"/>
    <circle cx="-8" cy="0" r="4" fill="#0F172A"/>
    
    <!-- Fob Ergonomic Body -->
    <rect x="-5" y="-20" width="75" height="110" rx="20" fill="url(#fobBody)" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="0" y="-15" width="65" height="100" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>

    <!-- Lock Button -->
    <rect x="12" y="-5" width="40" height="22" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <!-- Lock SVG Outline -->
    <rect x="28" y="3" width="8" height="7" rx="1" fill="#94A3B8"/>
    <path d="M 30 3 L 30 0 A 2 2 0 0 1 34 0 L 34 3" fill="none" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Unlock Button -->
    <rect x="12" y="24" width="40" height="22" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <!-- Unlock SVG Outline -->
    <rect x="28" y="32" width="8" height="7" rx="1" fill="#00A8B5"/>
    <path d="M 30 32 L 30 29 A 2 2 0 0 1 34 29" fill="none" stroke="#00A8B5" stroke-width="1.2"/>

    <!-- Trunk / Panic Button -->
    <rect x="12" y="52" width="40" height="20" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="32" y="65" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#EF4444" text-anchor="middle">HOLD</text>

    <!-- Fob LED Indicator -->
    <circle cx="32" cy="-10" r="2" fill="#4CD9A1"/>
  </g>
</svg>
