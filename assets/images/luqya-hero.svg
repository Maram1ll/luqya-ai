<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="لُقيا AI — بصمة إصبع رقمية بشبكة عصبية متوهجة">
  <title>لُقيا AI — بصمة إصبع رقمية مدمجة بشبكة عصبية متوهجة</title>
  <defs>
    <radialGradient id="fhBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14315E"/>
      <stop offset="60%" stop-color="#0B1C4D"/>
      <stop offset="100%" stop-color="#050C1F"/>
    </radialGradient>
    <radialGradient id="fhHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8B5" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00A8B5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00A8B5" stop-opacity="0"/>
    </radialGradient>
    <filter id="fhGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fhGlowTight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#fhBg)" stroke="#00A8B5" stroke-opacity="0.32" stroke-width="1"/>
  <circle cx="50" cy="50" r="49.5" fill="none" stroke="#00A8B5" stroke-opacity="0.14" stroke-width="1"/>
