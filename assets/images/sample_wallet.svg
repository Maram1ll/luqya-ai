<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="innerLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="walletShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="250" rx="16" fill="#0F172A"/>

  <!-- Open Bi-fold Wallet Outer Shell -->
  <rect x="35" y="35" width="330" height="180" rx="12" fill="url(#leatherGrad)" stroke="#4B5563" stroke-width="1.5" filter="url(#walletShadow)"/>
  
  <!-- Outer Perimeter Stitching (Dashed Line) -->
  <rect x="42" y="42" width="316" height="166" rx="8" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Wallet Center Fold Spine -->
  <line x1="200" y1="35" x2="200" y2="215" stroke="#111827" stroke-width="6"/>
  <line x1="200" y1="35" x2="200" y2="215" stroke="#374151" stroke-width="2"/>

  <!-- Left Flap: Credit Cards Pocket Stack -->
  <!-- Back Card Peeking Out (Gold Card) -->
  <rect x="55" y="55" width="130" height="40" rx="6" fill="url(#cardGold)" stroke="#B45309" stroke-width="1"/>
  <rect x="65" y="65" width="16" height="12" rx="2" fill="#FEF3C7"/>
  
  <!-- Middle Card Peeking Out (Cyan Card) -->
  <rect x="55" y="75" width="130" height="40" rx="6" fill="url(#cardBlue)" stroke="#0E7490" stroke-width="1"/>
  <circle cx="165" cy="95" r="10" fill="#4CD9A1" opacity="0.7"/>
  <circle cx="155" cy="95" r="10" fill="#00A8B5" opacity="0.7"/>

  <!-- Top Leather Pocket Covering -->
  <path d="M 50 100 L 190 100 L 190 200 L 50 200 Z" fill="url(#innerLeather)" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="100" x2="190" y2="100" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="55" y1="200" x2="185" y2="200" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Diagonal Card Slot on Left -->
  <path d="M 50 140 Q 120 150 190 140" fill="none" stroke="#111827" stroke-width="2"/>
  <path d="M 50 142 Q 120 152 190 142" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Right Flap: ID Window & Cash Pocket -->
  <rect x="210" y="55" width="140" height="145" rx="8" fill="url(#innerLeather)" stroke="#374151" stroke-width="1"/>
  
  <!-- Transparent ID Card Pocket Window -->
  <rect x="222" y="70" width="116" height="80" rx="6" fill="rgba(255,255,255,0.06)" stroke="#00A8B5" stroke-width="1.5"/>
  <circle cx="280" cy="100" r="15" fill="#475569"/>
  <path d="M 260 135 C 260 118 300 118 300 135 Z" fill="#475569"/>
  <text x="280" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">STUDENT ID</text>

  <!-- Embossed Brand Emblem on Bottom Right -->
  <g transform="translate(265, 168)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#00A8B5" stroke-width="1.5"/>
    <text x="15" y="19" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#4CD9A1" text-anchor="middle">R</text>
  </g>
  <text x="280" y="208" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">GENUINE LEATHER</text>
</svg>
