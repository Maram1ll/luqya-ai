<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="caseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="caseInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="airpodsShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="250" rx="16" fill="#0F172A"/>

  <!-- Charging Case Open Base -->
  <rect x="120" y="90" width="160" height="130" rx="40" fill="url(#caseBody)" filter="url(#airpodsShadow)"/>
  
  <!-- Opened Lid (Top Perspective) -->
  <path d="M 125 90 C 125 50 275 50 275 90 Z" fill="url(#caseBody)" stroke="#E2E8F0" stroke-width="1"/>
  <ellipse cx="200" cy="90" rx="72" ry="12" fill="url(#caseInner)"/>

  <!-- Earbuds Charging Wells -->
  <ellipse cx="165" cy="90" rx="20" ry="8" fill="#1E293B"/>
  <ellipse cx="235" cy="90" rx="20" ry="8" fill="#1E293B"/>

  <!-- Left AirPod Earbud (Resting in case with head visible) -->
  <g transform="translate(0, -10)">
    <!-- Earbud Head -->
    <ellipse cx="165" cy="80" rx="16" ry="14" fill="url(#stemGrad)" stroke="#CBD5E1" stroke-width="0.8"/>
    <!-- Black Mesh Speaker Grille -->
    <ellipse cx="160" cy="78" rx="5" ry="7" fill="#334155"/>
    <ellipse cx="173" cy="83" rx="3" ry="4" fill="#334155"/>
    <!-- Stem Top -->
    <rect x="160" y="88" width="10" height="25" rx="5" fill="url(#stemGrad)"/>
  </g>

  <!-- Right AirPod Earbud -->
  <g transform="translate(0, -10)">
    <!-- Earbud Head -->
    <ellipse cx="235" cy="80" rx="16" ry="14" fill="url(#stemGrad)" stroke="#CBD5E1" stroke-width="0.8"/>
    <!-- Black Mesh Speaker Grille -->
    <ellipse cx="240" cy="78" rx="5" ry="7" fill="#334155"/>
    <ellipse cx="227" cy="83" rx="3" ry="4" fill="#334155"/>
    <!-- Stem Top -->
    <rect x="230" y="88" width="10" height="25" rx="5" fill="url(#stemGrad)"/>
  </g>

  <!-- Case Body Seam Line -->
  <line x1="122" y1="92" x2="278" y2="92" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Glowing Green/Cyan Status LED Light -->
  <circle cx="200" cy="120" r="3.5" fill="#4CD9A1"/>
  <circle cx="200" cy="120" r="7" fill="#4CD9A1" opacity="0.35"/>

  <!-- Case Lightning/USB-C Port Ridge Accent -->
  <rect x="188" y="215" width="24" height="4" rx="2" fill="#94A3B8"/>

  <!-- Minimal Brand Vector Text -->
  <text x="200" y="165" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94A3B8" text-anchor="middle" letter-spacing="1">WIRELESS EARBUDS</text>
  <text x="200" y="180" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#00A8B5" text-anchor="middle">ACTIVE NOISE CANCELLATION</text>
</svg>
