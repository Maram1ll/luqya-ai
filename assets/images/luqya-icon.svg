<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="لُقيا AI">
  <title>لُقيا AI — بصمة إصبع رقمية مدمجة بشبكة عصبية متوهجة</title>
  <defs>
    <radialGradient id="fiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14315E"/>
      <stop offset="60%" stop-color="#0B1C4D"/>
      <stop offset="100%" stop-color="#050C1F"/>
    </radialGradient>
    <filter id="fiGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
