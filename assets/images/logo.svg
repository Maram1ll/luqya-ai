<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-422.3 12.0 580.3 272.0" role="img" aria-label="لُقيا AI" shape-rendering="geometricPrecision">
  <title>لُقيا AI</title>
  <desc>شعار لُقيا AI بخلفية شفافة: كلمة لُقيا باللون الأبيض مع عدسة مكبّرة معدنية زرقاء ودارات كهربائية مضيئة و AI متوهجة في مركز العدسة مع توهج داخلي وظلال ناعمة</desc>
  <style>
    .luqya-float {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: luqya-float 5s ease-in-out infinite;
    }
    .luqya-halo { animation: luqya-halo 5s ease-in-out infinite; }
    .luqya-ai { animation: luqya-ai 5s ease-in-out infinite; }
    .luqya-flare { animation: luqya-flare 5s ease-in-out infinite; }
    .luqya-handletrace { animation: luqya-trace 3.6s ease-in-out infinite; }
    .luqya-nodes circle { animation: luqya-twinkle 3s ease-in-out infinite; }
    .luqya-nodes circle:nth-child(2n) { animation-delay: .35s; }
    .luqya-nodes circle:nth-child(3n) { animation-delay: .7s; }
    .luqya-nodes circle:nth-child(5n) { animation-delay: 1.05s; }
    @keyframes luqya-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
    @keyframes luqya-halo {
      0%, 100% { opacity: .5; }
      50%      { opacity: 1; }
    }
    @keyframes luqya-ai {
      0%, 100% { opacity: .8; }
      50%      { opacity: 1; }
    }
    @keyframes luqya-flare {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes luqya-trace {
      0%, 100% { opacity: .6; }
      50%      { opacity: 1; }
    }
    @keyframes luqya-twinkle {
      0%, 100% { opacity: .3; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .luqya-float, .luqya-halo, .luqya-ai, .luqya-flare, .luqya-handletrace, .luqya-nodes circle {
        animation: none;
      }
    }
  </style>

  <defs>
    <filter id="magShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#03112e" flood-opacity="0.40"/>
    </filter>
    <radialGradient id="flareCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#4ff0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00a8b5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#00a8b5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00a8b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="luqya-float">

    <!-- outer breathing cyan halo -->
    <g class="luqya-halo" fill="none" stroke="#2ee6ff">
      <circle cx="0" cy="120.0" r="102" stroke-opacity="0.07" stroke-width="3"/>
    </g>

    <g filter="url(#magShadow)">
    <!-- handle (45 deg down-right): metallic layers + dark PCB inlay groove -->
    <path d="M 61.80 181.80 L 103.80 223.80" fill="none" stroke="#0a192f" stroke-width="36" stroke-linecap="round"/>
    <path d="M 65.80 185.80 L 107.80 227.80" fill="none" stroke="#113059" stroke-width="28" stroke-linecap="round"/>
    <path d="M 63.80 183.80 L 105.80 225.80" fill="none" stroke="#1d3d7d" stroke-width="19" stroke-linecap="round"/>
    <path d="M 60.80 180.80 L 102.80 222.80" fill="none" stroke="#00a8b5" stroke-width="7" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- recessed inlay -->
    <path d="M 65.80 185.80 L 107.80 227.80" fill="none" stroke="#0a1626" stroke-width="13" stroke-linecap="round"/>
    <!-- inlay PCB traces + cross jumper, mirroring the lens -->
    <g class="luqya-handletrace" fill="none" stroke-linecap="round">
      <path d="M 68.77 182.83 L 110.77 224.83" stroke="#2ee6ff" stroke-width="2.6" stroke-opacity="0.7"/>
      <path d="M 68.77 182.83 L 110.77 224.83" stroke="#ffffff" stroke-width="1"/>
      <path d="M 62.83 188.77 L 104.83 230.77" stroke="#2ee6ff" stroke-width="2.6" stroke-opacity="0.7"/>
      <path d="M 62.83 188.77 L 104.83 230.77" stroke="#ffffff" stroke-width="1"/>
      <path d="M 89.77 203.83 L 83.83 209.77" stroke="#4ff0ff" stroke-width="1.4" stroke-opacity="0.5"/>
    </g>
    <g>
      <circle cx="68.8" cy="182.8" r="2" fill="#4ff0ff"/><circle cx="68.8" cy="182.8" r="0.9" fill="#ffffff"/>
      <circle cx="62.8" cy="188.8" r="2" fill="#4ff0ff"/><circle cx="62.8" cy="188.8" r="0.9" fill="#ffffff"/>
      <circle cx="110.8" cy="224.8" r="2" fill="#4ff0ff"/><circle cx="110.8" cy="224.8" r="0.9" fill="#ffffff"/>
      <circle cx="104.8" cy="230.8" r="2" fill="#4ff0ff"/><circle cx="104.8" cy="230.8" r="0.9" fill="#ffffff"/>
      <circle cx="89.8" cy="203.8" r="2" fill="#4ff0ff"/><circle cx="89.8" cy="203.8" r="0.9" fill="#ffffff"/>
      <circle cx="83.8" cy="209.8" r="2" fill="#4ff0ff"/><circle cx="83.8" cy="209.8" r="0.9" fill="#ffffff"/>
    </g>

    <!-- lens interior: deep dark navy -->
    <circle cx="0" cy="120.0" r="70" fill="#0a192f"/>
    <circle cx="0" cy="120.0" r="46" fill="none" stroke="#00a8b5" stroke-opacity="0.09" stroke-width="1.4"/>
    <circle cx="0" cy="120.0" r="30" fill="none" stroke="#00a8b5" stroke-opacity="0.09" stroke-width="1.2"/>

    <!-- glowing circuit traces -->
          <g fill="none" stroke="#00a8b5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3">
        <path d="M 4 96.0 V 70.0"/>
        <path d="M -24 90.0 H -38 V 70.0"/>
        <path d="M -24 114.0 H -44 V 96.0"/>
