        <path d="M -24 146.0 H -40 V 164.0"/>
        <path d="M 28 112.0 H 44 V 88.0"/>
        <path d="M 28 142.0 H 42 V 162.0"/>
        <path d="M 4 144.0 V 168.0"/>
