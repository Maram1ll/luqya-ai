    <!-- lens flare burst inside the A -->
    <g class="luqya-flare" stroke="#ffffff" fill="none">
      <path d="M -35.26 120.00 H 24.74" stroke-width="2.2" stroke-opacity="0.8" stroke-linecap="round"/>
      <path d="M -5.26 98.00 V 142.00" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
      <path d="M -17.26 108.00 L 6.74 132.00" stroke-width="1.1" stroke-opacity="0.4"/>
      <path d="M -17.26 132.00 L 6.74 108.00" stroke-width="1.1" stroke-opacity="0.4"/>
