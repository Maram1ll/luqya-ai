    <circle cx="0" cy="120.0" r="83" fill="none" stroke="#2ee6ff" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="0" cy="120.0" r="71" fill="none" stroke="#00a8b5" stroke-width="1.5" stroke-opacity="0.5"/>

