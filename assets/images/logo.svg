    </g>

    <!-- collar joining handle to rim -->
    <circle cx="65.8" cy="185.8" r="19" fill="#113059" stroke="#00a8b5" stroke-width="2.5"/>
    <circle cx="64.8" cy="184.8" r="12" fill="#1d3d7d" stroke="#2ee6ff" stroke-opacity="0.8" stroke-width="1.5"/>
