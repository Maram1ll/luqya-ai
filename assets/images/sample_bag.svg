<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bagMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="60%" stop-color="#0F213D"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8B5"/>
      <stop offset="100%" stop-color="#4CD9A1"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24426E"/>
      <stop offset="100%" stop-color="#152744"/>
    </linearGradient>
    <filter id="bagShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="250" rx="16" fill="#0F172A"/>

  <!-- Backpack Top Grab Handle -->
  <path d="M 165 40 C 165 20 235 20 235 40" fill="none" stroke="#00A8B5" stroke-width="8" stroke-linecap="round"/>
  <path d="M 168 40 C 168 25 232 25 232 40" fill="none" stroke="#1B365D" stroke-width="4" stroke-linecap="round"/>

  <!-- Left & Right Padded Shoulder Straps (Behind) -->
  <path d="M 140 50 C 100 80 95 190 120 225" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M 260 50 C 300 80 305 190 280 225" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>

  <!-- Main Backpack Body Outer Contour -->
  <path d="M 130 80 C 130 35 270 35 270 80 L 285 200 C 285 225 115 225 115 200 Z" fill="url(#bagMain)" stroke="#00A8B5" stroke-width="1.5" filter="url(#bagShadow)"/>

  <!-- Main Dual Zipper Arc Line -->
  <path d="M 133 80 C 133 42 267 42 267 80 L 280 180" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="4,2"/>
  
  <!-- Cyan Accent Wave Across Upper Body -->
  <path d="M 130 100 Q 200 120 270 100 L 273 115 Q 200 135 127 115 Z" fill="url(#bagAccent)"/>

  <!-- Front Storage Pocket -->
  <rect x="140" y="130" width="120" height="75" rx="14" fill="url(#pocketGrad)" stroke="#00A8B5" stroke-width="1.5"/>
  
  <!-- Front Pocket Zipper -->
  <line x1="150" y1="145" x2="250" y2="145" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4,2"/>
  <!-- Zipper Pull Tag -->
  <circle cx="245" cy="145" r="4" fill="#4CD9A1"/>
  <rect x="243" y="147" width="4" height="10" rx="1" fill="#00A8B5"/>

  <!-- Front Brand Geometric Badge -->
  <g transform="translate(185, 162)">
    <polygon points="15,0 30,12 24,28 6,28 0,12" fill="#00A8B5"/>
    <text x="15" y="18" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>

  <!-- Side Elastic Mesh Water Bottle Holder (Left) -->
  <path d="M 115 150 Q 100 170 115 200 Z" fill="#1E293B" stroke="#00A8B5" stroke-width="1"/>
  <path d="M 108 145 C 108 135 118 135 118 145 L 118 170 C 118 175 108 175 108 170 Z" fill="#00A8B5" opacity="0.6"/>

  <!-- Side Elastic Mesh Pocket (Right) -->
  <path d="M 285 150 Q 300 170 285 200 Z" fill="#1E293B" stroke="#00A8B5" stroke-width="1"/>

  <!-- Bottom Reinforced Suede/Leather Panel -->
  <path d="M 116 200 C 116 225 284 225 284 200 Z" fill="#0F172A"/>
</svg>
